[project]
name = "scorebench"
version = "0.1.0"
description = "Reproducible diagnostic benchmark for melody and chord recognition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow>=11,<12",
  "music21>=9.7,<10",
  "converter21>=4,<5",
  "verovio==6.3.0",
  "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
neural = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==4.57.3",
  "torchtune==0.6.1",
  "torchao==0.15.0",
  "loguru>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
