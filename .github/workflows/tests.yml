name: Tests

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.6.6
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run regression tests
        run: uv run --no-sync pytest -q

  docker-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.6.6
      - run: uv sync --locked --group dev
      - name: Load pinned execution image
        run: |
          docker pull python:3.12-slim@sha256:12316debbfb86890f6b2d825820612741ba527ad5a44e3902759141d572bfe8f
          docker tag python:3.12-slim@sha256:12316debbfb86890f6b2d825820612741ba527ad5a44e3902759141d572bfe8f python:3.12-slim
      - name: Test real Docker isolation and protected scoring
        run: GOALAGENT_DOCKER_TESTS=1 uv run --no-sync pytest -q tests/test_research.py -k real_
      - name: Verify immutable publication across registries
        run: GOALAGENT_DOCKER_TESTS=1 uv run --no-sync pytest -q tests/test_environments.py -k two_registries
      - name: Build and verify reusable environment
        run: uv run --no-sync python -m goalagent.environment_check --run-dir /tmp/environment-verification
      - name: Verify configurable team, tool reuse and generic environment
        run: uv run --no-sync python -m goalagent.team_check --run-dir /tmp/configurable-team-verification
